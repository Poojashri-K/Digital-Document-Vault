server:
  servlet:
    session:
      cookie:
        secure: ${VAULT_COOKIE_SECURE:false}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:vault_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:vault_user}
    password: ${DB_PASSWORD:vault_secure_password_2026}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

vault:
  storage:
    location: /vault_storage
