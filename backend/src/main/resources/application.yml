server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false # set true via VAULT_COOKIE_SECURE in production HTTPS
        name: JSESSIONID

spring:
  application:
    name: digital-document-vault
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

vault:
  storage:
    location: vault_storage
    max-file-size-bytes: 20971520 # 20MB
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173
